[project]
name = "arc-robot-runtime"
version = "0.1.0"
description = "ARC robot Python runtime, calibration tools, and local service"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "numpy>=2.0.0",
    "opencv-python-headless>=4.10.0.0",
    "pydantic>=2.8.0",
    "requests>=2.32.0",
    "uvicorn[standard]>=0.30.0",
]

[tool.uv]
package = false
