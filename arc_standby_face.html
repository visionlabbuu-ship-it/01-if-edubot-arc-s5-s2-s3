<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARC Pixel Face</title>
  <style>
    :root {
      --bg: #000;
      --grid: rgba(96, 255, 228, 0.08);
      --head: #74f7d1;
      --head-dark: #22a88a;
      --eye: #071014;
      --eye-shine: #f4fffb;
      --cheek: #ff8db5;
      --mouth: #081216;
      --text: #bdfce9;
      --muted: rgba(189, 252, 233, 0.56);
      --accent: #ffe66d;
      --pixel: clamp(8px, 1.4vmin, 16px);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Consolas, "Courier New", monospace;
      letter-spacing: 0;
      user-select: none;
    }

    body {
      display: grid;
      place-items: center;
      cursor: none;
    }

    .screen {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px),
        radial-gradient(circle at 50% 56%, rgba(43, 255, 203, 0.12), transparent 34%),
        #000;
      background-size: 34px 34px, 34px 34px, auto, auto;
    }

    .stars {
      position: absolute;
      inset: 0;
      opacity: 0.7;
      background:
        radial-gradient(circle, #fff 0 1px, transparent 2px) 12% 16% / 140px 120px,
        radial-gradient(circle, #ffe66d 0 1px, transparent 2px) 82% 24% / 180px 150px,
        radial-gradient(circle, #74f7d1 0 1px, transparent 2px) 42% 78% / 220px 190px;
      animation: stars 18s steps(4) infinite;
    }

    .robot-wrap {
      position: relative;
      width: min(78vw, 640px);
      aspect-ratio: 1.16;
      display: grid;
      place-items: center;
      image-rendering: pixelated;
      filter: drop-shadow(0 0 24px rgba(116, 247, 209, 0.24));
    }

    .antenna {
      position: absolute;
      top: 2%;
      left: 50%;
      width: calc(var(--pixel) * 2);
      height: calc(var(--pixel) * 8);
      transform: translateX(-50%);
      background: var(--head-dark);
      box-shadow:
        0 calc(var(--pixel) * -2) 0 var(--accent),
        calc(var(--pixel) * -1) calc(var(--pixel) * -3) 0 var(--accent),
        calc(var(--pixel) * 1) calc(var(--pixel) * -3) 0 var(--accent);
      animation: antenna 2.8s steps(2) infinite;
    }

    .head {
      position: relative;
      width: min(66vw, 520px);
      aspect-ratio: 1.18;
      margin-top: 8%;
      background: var(--head);
      border: calc(var(--pixel) * 1.2) solid var(--head-dark);
      border-radius: 0;
      box-shadow:
        inset calc(var(--pixel) * -1) calc(var(--pixel) * -1) 0 rgba(0, 0, 0, 0.18),
        inset calc(var(--pixel) * 1) calc(var(--pixel) * 1) 0 rgba(255, 255, 255, 0.34);
      clip-path: polygon(
        8% 0,
        92% 0,
        92% 8%,
        100% 8%,
        100% 92%,
        92% 92%,
        92% 100%,
        8% 100%,
        8% 92%,
        0 92%,
        0 8%,
        8% 8%
      );
      animation: bob 3.6s steps(3) infinite;
    }

    .ear {
      position: absolute;
      top: 40%;
      width: calc(var(--pixel) * 4);
      height: calc(var(--pixel) * 12);
      background: var(--head-dark);
    }

    .ear.left {
      left: calc(var(--pixel) * -4);
    }

    .ear.right {
      right: calc(var(--pixel) * -4);
    }

    .eye {
      position: absolute;
      top: 34%;
      width: 22%;
      aspect-ratio: 1;
      background: var(--eye);
      border-radius: 0;
      box-shadow:
        inset calc(var(--pixel) * 1.5) calc(var(--pixel) * 1.5) 0 var(--eye-shine),
        0 calc(var(--pixel) * 0.8) 0 rgba(0, 0, 0, 0.14);
      animation: blink 5.8s steps(1) infinite;
    }

    .eye.left {
      left: 20%;
    }

    .eye.right {
      right: 20%;
    }

    .cheek {
      position: absolute;
      top: 62%;
      width: 13%;
      height: 8%;
      background: var(--cheek);
      opacity: 0.82;
      animation: cheek 3.6s steps(2) infinite;
    }

    .cheek.left {
      left: 16%;
    }

    .cheek.right {
      right: 16%;
    }

    .mouth {
      position: absolute;
      left: 50%;
      top: 63%;
      width: 22%;
      height: 14%;
      transform: translateX(-50%);
    }

    .mouth::before,
    .mouth::after {
      content: "";
      position: absolute;
      bottom: 0;
      width: 34%;
      height: 54%;
      border-bottom: calc(var(--pixel) * 1.4) solid var(--mouth);
    }

    .mouth::before {
      left: 8%;
      border-left: calc(var(--pixel) * 1.4) solid var(--mouth);
    }

    .mouth::after {
      right: 8%;
      border-right: calc(var(--pixel) * 1.4) solid var(--mouth);
    }

    .screen.listening {
      --head: #7dffb2;
      --head-dark: #2da869;
      --text: #ccffe1;
    }

    .screen.thinking {
      --head: #9eb2ff;
      --head-dark: #5f6fc4;
      --text: #dfe5ff;
    }

    .screen.working {
      --head: #ffe66d;
      --head-dark: #c69320;
      --text: #fff0a5;
    }

    .screen.alert {
      --head: #ff8aa0;
      --head-dark: #bb3b52;
      --text: #ffd3dc;
    }

    .screen.thinking .eye {
      animation: look 2.2s steps(2) infinite, blink 6s steps(1) infinite;
    }

    .screen.working .mouth {
      animation: talk 900ms steps(2) infinite;
    }

    .screen.alert .head {
      animation: alert 700ms steps(2) infinite;
    }

    .label {
      position: absolute;
      left: 50%;
      bottom: clamp(24px, 6vh, 58px);
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: clamp(15px, 2.6vmin, 24px);
      font-weight: 800;
      text-transform: uppercase;
      color: var(--text);
      text-shadow: 0 0 12px rgba(116, 247, 209, 0.32);
    }

    .pixel-dot {
      width: calc(var(--pixel) * 1.4);
      height: calc(var(--pixel) * 1.4);
      background: var(--accent);
      box-shadow: 0 0 12px rgba(255, 230, 109, 0.7);
      animation: dot 1.2s steps(2) infinite;
    }

    .brand {
      position: absolute;
      left: clamp(18px, 3vw, 44px);
      bottom: clamp(18px, 3vw, 44px);
      color: var(--muted);
      font-size: clamp(14px, 2vmin, 20px);
      font-weight: 800;
    }

    .controls {
      position: absolute;
      right: clamp(16px, 3vw, 38px);
      top: clamp(16px, 3vw, 34px);
      display: flex;
      gap: 8px;
      opacity: 0;
      transition: opacity 160ms ease;
    }

    .screen:hover .controls,
    .screen.show-ui .controls {
      opacity: 1;
    }

    button {
      min-width: 42px;
      height: 34px;
      border: calc(var(--pixel) * 0.2) solid rgba(189, 252, 233, 0.34);
      border-radius: 0;
      background: #050b0b;
      color: rgba(220, 255, 245, 0.86);
      font-family: inherit;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    button:hover {
      background: #0d2926;
      color: #fff;
    }

    @keyframes blink {
      0%, 88%, 100% { transform: scaleY(1); }
      92% { transform: scaleY(0.16); }
    }

    @keyframes look {
      0%, 100% { translate: 0 0; }
      50% { translate: calc(var(--pixel) * 1.2) 0; }
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(calc(var(--pixel) * -1)); }
    }

    @keyframes talk {
      0%, 100% { transform: translateX(-50%) scaleY(1); }
      50% { transform: translateX(-50%) scaleY(0.55); }
    }

    @keyframes alert {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(calc(var(--pixel) * -0.8)); }
    }

    @keyframes cheek {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }

    @keyframes antenna {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.3); }
    }

    @keyframes dot {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    @keyframes stars {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(8px); }
    }

    @media (max-width: 720px) {
      .robot-wrap {
        width: 88vw;
      }

      .head {
        width: 78vw;
      }

      .controls {
        display: none;
      }
    }
  </style>
</head>
<body>
  <main class="screen idle" id="screen" aria-label="ARC pixel robot face">
    <div class="stars" aria-hidden="true"></div>

    <section class="robot-wrap" aria-hidden="true">
      <div class="antenna"></div>
      <div class="head">
        <div class="ear left"></div>
        <div class="ear right"></div>
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="cheek left"></div>
        <div class="cheek right"></div>
        <div class="mouth"></div>
      </div>
    </section>

    <div class="label"><span class="pixel-dot"></span><span id="statusText">ARC READY</span></div>
    <div class="brand">ARC-8</div>
    <nav class="controls" aria-label="Face modes">
      <button data-mode="idle">Idle</button>
      <button data-mode="listening">Listen</button>
      <button data-mode="thinking">Think</button>
      <button data-mode="working">Work</button>
      <button data-mode="alert">Alert</button>
    </nav>
  </main>

  <script>
    const screen = document.getElementById("screen");
    const statusText = document.getElementById("statusText");
    const modes = {
      idle: "ARC READY",
      listening: "LISTENING",
      thinking: "THINKING",
      working: "WORKING",
      alert: "HELLO?"
    };

    function setMode(mode) {
      if (!modes[mode]) return;
      screen.className = `screen ${mode}`;
      statusText.textContent = modes[mode];
    }

    document.querySelectorAll("[data-mode]").forEach((button) => {
      button.addEventListener("click", () => setMode(button.dataset.mode));
    });

    document.addEventListener("keydown", (event) => {
      const keyMap = {
        "1": "idle",
        "2": "listening",
        "3": "thinking",
        "4": "working",
        "5": "alert",
        "Escape": "idle"
      };
      if (keyMap[event.key]) setMode(keyMap[event.key]);
      if (event.key.toLowerCase() === "u") {
        screen.classList.toggle("show-ui");
      }
    });

    window.arcFace = { setMode };
  </script>
</body>
</html>
